<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot de Análisis de Sentimiento</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            font-size: 18px; /* 增大全局字体大小 */
        }

       .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            font-size: 24px; /* 增大标题字体大小 */
        }

        h2 {
            font-size: 22px; /* 增大二级标题字体大小 */
        }

        h3 {
            font-size: 20px; /* 增大三级标题字体大小 */
        }

        form {
            margin-top: 20px;
        }

        label {
            font-weight: bold;
            font-size: 18px; /* 增大标签字体大小 */
        }

        textarea,
        input[type="text"],
        select,
        input[type="file"] {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            font-size: 18px; /* 增大输入框字体大小 */
        }

        button.btn {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 18px; /* 增大按钮字体大小 */
        }

        button.btn:hover {
            background-color: #0056b3;
        }

        #results {
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            background-color: #f9f9f9;
        }

        #loading {
            margin-top: 20px;
            text-align: center;
        }

       .star-rating {
            font-size: 20px;
            color: #ffc107; /* 星星的颜色 */
        }

       .star-rating.half-star::before {
            content: "";
        }

       .star-rating.half-star::after {
            content: "";
        }

       .star-rating.empty-star::before {
            content: "★★★★★";
            color: #ccc; /* 空星星的颜色 */
        }

       .json-content {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            white-space: pre-wrap;
            margin-top: 5px;
        }

       .chart-container h3 {
            white-space: normal; /* 允许标题换行 */
            word-wrap: break-word; /* 单词内换行 */
        }

       .chart-container {
            overflow: auto; /* 出现内容溢出时显示滚动条 */
            margin-bottom: 15px; /* 在图表容器下方添加一些间距 */
        }

       .chart-container img {
            max-width: 100%; /* 图片最大宽度为容器宽度 */
            height: auto; /* 保持图片的宽高比 */
            display: block; /* 去除图片下方的空白间隙 */
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center">Bot de Análisis de Sentimiento</h1>
    <form id="analysis-form" class="mt-4">
        <div class="mb-3">
            <label for="user_text" class="form-label">Texto de entrada o ruta del archivo o ruta del archivo CSV:</label>
            <textarea class="form-control" id="user_text" name="user_text" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="analysis_type" class="form-label">Elija el tipo de análisis:</label>
            <select class="form-select" id="analysis_type" name="analysis_type" required>
                <option value="texto">Analizar el texto</option>
                <option value="archivo">Analizar el archivo</option>
                <option value="csv">Analizar el archivo CSV</option>
                <option value="recomendaciones">Obtener recomendaciones de hoteles</option>
                <option value="recomendaciones_peliculas">Obtener recomendaciones de películas</option>
            </select>
        </div>
        <div class="mb-3" id="csv-file-input" style="display: none;">
            <label for="user_file" class="form-label">Seleccione el archivo CSV:</label>
            <input type="file" class="form-control" id="user_file" name="user_file">
        </div>
        <div class="mb-3" id="recommendation-input" style="display: none;">
            <label for="user_location" class="form-label">Ingrese la ubicación para obtener recomendaciones de
                hoteles:</label>
            <input type="text" class="form-control" id="user_location" name="user_location">
            <label for="user_label" class="form-label">Ingrese la etiqueta (opcional):</label>
            <input type="text" class="form-control" id="user_label" name="user_label">
        </div>
        <div class="mb-3" id="movie-recommendation-input" style="display: none;">
            <label for="user_gender" class="form-label">Ingrese el género para obtener recomendaciones de
                películas:</label>
            <input type="text" class="form-control" id="user_gender" name="user_gender">
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
    <div id="results" class="mt-4" style="display: none;">
        <h2>Resultados</h2>
        <div id="sentiment-results"></div>
        <div id="keywords-results" class="mt-3"></div>
        <div id="wordcloud-container" class="mt-4">
            <h3 class="chart-container h3">Gráfico de Nube de Palabras</h3>
            <img id="wordcloud" src="" alt="La nube de palabras aparecerá aquí" class="img-fluid">
        </div>
        <div id="recommendations-results" class="mt-3"></div>
        <div id="movie-recommendations-results" class="mt-3"></div>
        <div id="chart-container" class="mt-4">
            <h3 class="chart-container h3">Gráfico de Resultados</h3>
            <img id="bar-chart" src="" alt="El gráfico de barras aparecerá aquí" class="img-fluid">
            <h3 class="chart-container h3">Gráfico de Líneas de Resultados</h3>
            <img id="line-chart" src="" alt="El gráfico de líneas aparecerá aquí" class="img-fluid">
        </div>
    </div>
    <div id="loading" class="mt-4" style="display: none;">
        <p>Cargando...</p>
    </div>
</div>

<script>
        $(document).ready(function () {
            $('#analysis_type').on('change', function () {
                var selectedOption = $(this).val();
                if (selectedOption === 'csv') {
                    $('#csv-file-input').show();
                    $('#recommendation-input').hide();
                    $('#movie-recommendation-input').hide();
                } else if (selectedOption === 'recomendaciones') {
                    $('#csv-file-input').hide();
                    $('#recommendation-input').show();
                    $('#movie-recommendation-input').hide();
                } else if (selectedOption === 'recomendaciones_peliculas') {
                    $('#csv-file-input').hide();
                    $('#recommendation-input').hide();
                    $('#movie-recommendation-input').show();
                } else if (selectedOption === 'archivo') {
                    // 显示文件输入框
                    $('#csv-file-input').show();
                    $('#recommendation-input').hide();
                    $('#movie-recommendation-input').hide();
                } else {
                    $('#csv-file-input').hide();
                    $('#recommendation-input').hide();
                    $('#movie-recommendation-input').hide();
                }
            });

            $('#analysis-form').on('submit', function (e) {
                e.preventDefault();

                var formData = new FormData(this);
                $('#results').hide();
                $('#loading').show();

                $.ajax({
                    url: '/analyze',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (response) {
                        console.log('Respuesta del servidor:', response);
                        $('#loading').hide();
                        $('#results').show();
                        if (response.error) {
                            $('#sentiment-results').text(response.error);
                        } else {
                            if (response.wordcloud) {
                                var wordcloudHtml = '<img id="wordcloud" src="data:image/png;base64,' + response.wordcloud + '" alt="La nube de palabras aparecerá aquí" class="img-fluid">';
                                $('#wordcloud-container').html(wordcloudHtml);
                            }
                            if (response.result) {
                                if (Array.isArray(response.result)) {
                                    var sentimentHtml = '<h3>Resultados del análisis de sentimiento:</h3>';
                                    response.result.forEach(function (result, index) {
                                        var ratingStars = '';
                                        var starMatch = result.sentiment && result.sentiment.match(/(\d+)\s*stars?/i);
                                        if (starMatch) {
                                            var starCount = parseInt(starMatch[1]);
                                            for (var i = 0; i < starCount; i++) {
                                                ratingStars += '★';
                                            }
                                        }
                                        var jsonContent = JSON.stringify(result, null, 2);
                                        jsonContent = jsonContent.replace(/^{/, '').replace(/}$/, '');
                                        sentimentHtml += `<p>Reseña ${index + 1}: <div class="json-content">${jsonContent}</div> Calificación: <span class="star-rating">${ratingStars}</span></p>`;
                                    });
                                    $('#sentiment-results').html(sentimentHtml);
                                } else {
                                    var sentimentHtml = '<h3>Resultados del análisis de sentimiento:</h3>';
                                    var jsonContent = JSON.stringify(response.result, null, 2);
                                    jsonContent = jsonContent.replace(/^{/, '').replace(/}$/, '');
                                    var ratingStars = '';
                                    var starMatch = response.result.sentiment && response.result.sentiment.match(/(\d+)\s*stars?/i);
                                    if (starMatch) {
                                        var starCount = parseInt(starMatch[1]);
                                        for (var i = 0; i < starCount; i++) {
                                            ratingStars += '★';
                                        }
                                    }
                                    sentimentHtml += '<div class="json-content">' + jsonContent + '</div> Calificación: <span class="star-rating">' + ratingStars + '</span>';
                                    $('#sentiment-results').html(sentimentHtml);
                                }
                            }

                            if (response.keywords) {
                                var keywordsHtml = '<h3>Palabras clave extraídas:</h3>';
                                keywordsHtml += '<ul>';
                                var keywordsArray = response.keywords.split(', ');
                                keywordsArray.forEach(function (keyword) {
                                    keywordsHtml += '<li>' + keyword + '</li>';
                                });
                                keywordsHtml += '</ul>';
                                $('#keywords-results').html(keywordsHtml);
                            }

                            if (response.recommendations) {
                                var recommendationsHtml = '<h3>Recomendaciones de hoteles:</h3>';
                                recommendationsHtml += '<ul>';
                                response.recommendations.forEach(function (recommendation) {
                                    var ratingStars = '';
                                    var starMatch = recommendation.sentiment && recommendation.sentiment.match(/(\d+)\s*stars?/i);
                                    if (starMatch) {
                                        var starCount = parseInt(starMatch[1]);
                                        for (var i = 0; i < starCount; i++) {
                                            ratingStars += '★';
                                        }
                                    }
                                    var jsonContent = JSON.stringify(recommendation, null, 2);
                                    jsonContent = jsonContent.replace(/^{/, '').replace(/}$/, '');
                                    recommendationsHtml += `<li>Hotel: ${recommendation.hotel}, Puntuación promedio: <span class="star-rating">${ratingStars}</span><div class="json-content">${jsonContent}</div></li>`;
                                });
                                $('#recommendations-results').html(recommendationsHtml);
                            }

                            if (response.movie_recommendations) {
                                console.log('电影推荐数据:', response.movie_recommendations); // 调试信息
                                var movieRecommendationsHtml = '<h3>Recomendaciones de películas:</h3>';
                                movieRecommendationsHtml += '<ul>';
                                response.movie_recommendations.forEach(function (recommendation) {
                                    var ratingStars = '';
                                    var starMatch = recommendation.sentiment && recommendation.sentiment.match(/(\d+)\s*stars?/i);
                                    if (starMatch) {
                                        var starCount = parseInt(starMatch[1]);
                                        for (var i = 0; i < starCount; i++) {
                                            ratingStars += '★';
                                        }
                                    }
                                    var jsonContent = JSON.stringify(recommendation, null, 2);
                                    jsonContent = jsonContent.replace(/^{/, '').replace(/}$/, '');
                                    movieRecommendationsHtml += `<li>Película: ${recommendation.movie}, Puntuación promedio: <span class="star-rating">${ratingStars}</span><div class="json-content">${jsonContent}</div></li>`;
                                });
                                console.log('生成的 HTML 内容:', movieRecommendationsHtml); // 调试信息
                                $('#movie-recommendations-results').html(movieRecommendationsHtml);
                                console.log('电影推荐结果已更新到页面'); // 调试信息
                            }

                            if (response.bar_chart) {
                                console.log('Datos del gráfico de barras recibidos:', response.bar_chart);
                                $('#bar-chart').on('error', function () {
                                    console.error('No se pudo cargar la imagen del gráfico de barras.');
                                    $('#bar-chart').attr('alt', 'No se pudo cargar la imagen del gráfico de barras.');
                                }).attr('src', 'data:image/png;base64,' + response.bar_chart);
                            }

                            if (response.line_chart) {
                                console.log('Datos del gráfico de líneas recibidos:', response.line_chart);
                                $('#line-chart').on('error', function () {
                                    console.error('No se pudo cargar la imagen del gráfico de líneas.');
                                    $('#line-chart').attr('alt', 'No se pudo cargar la imagen del gráfico de líneas.');
                                }).attr('src', 'data:image/png;base64,' + response.line_chart);
                            }
                        }
                    },
                    error: function () {
                        $('#loading').hide();
                        $('#sentiment-results').text('Ocurrió un error al procesar su solicitud.');
                    }
                });
            });
        });
    </script>
</body>

</html>
